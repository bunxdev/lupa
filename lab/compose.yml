# From the repository root: docker compose -f docker-compose.yml -f lab/compose.yml up -d
# micro pattern: base images + mounted startup scripts + persistent services.
services:
  obscura:
    image: debian:trixie-slim
    network_mode: host
    init: true
    environment:
      OBSCURA_VERSION: v0.2.2
      OBSCURA_PORT: ${OBSCURA_PORT:-9231}
    volumes:
      - ./lab/scripts:/scripts:ro
      - obscura_data:/data
    command: [bash, /scripts/obscura.sh]
    restart: unless-stopped
    mem_limit: 1g

  lightpanda:
    image: debian:trixie-slim
    network_mode: host
    init: true
    environment:
      LIGHTPANDA_PORT: ${LIGHTPANDA_PORT:-9232}
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
      LIGHTPANDA_SHA256: a036f12ce955c2388d38c99c5e688a06a96642c593d49e00db984862fb9b41cf
    volumes:
      - ./lab/scripts:/scripts:ro
      - lightpanda_data:/data
    command: [bash, /scripts/lightpanda.sh]
    restart: unless-stopped
    mem_limit: 1g

  browseros:
    image: ghcr.io/linuxserver/baseimage-selkies:debiantrixie
    shm_size: 1gb
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TITLE: BrowserOS
      PUID: ${PUID:-911}
      PGID: ${PGID:-911}
      CUSTOM_USER: ${SELKIES_USER:-lupa}
      PASSWORD: ${SELKIES_PASSWORD:-}
      BROWSEROS_VERSION: 0.50.3
      SELKIES_PUBLIC_PORT: ${BROWSEROS_DESKTOP_PORT:-6081}
      SELKIES_FRAMERATE: "30"
      SELKIES_ENCODER: x264enc
    ports:
      - "127.0.0.1:${BROWSEROS_DESKTOP_PORT:-6081}:3000"
      - "127.0.0.1:${BROWSEROS_CDP_PORT:-9233}:9223"
    volumes:
      - ./lab/browseros/init:/custom-cont-init.d:ro
      - ./lab/browseros/services:/custom-services.d:ro
      - browseros_config:/config
    restart: unless-stopped
    mem_limit: 2g

  agent-browser:
    image: node:24-bookworm-slim
    network_mode: host
    init: true
    shm_size: 512mb
    environment:
      HOME: /data
      AGENT_BROWSER_VERSION: 0.37.1
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      AGENT_BROWSER_ARGS: --no-sandbox,--disable-dev-shm-usage
      AGENT_BROWSER_PROFILE: /data/profile
      AGENT_BROWSER_IDLE_TIMEOUT_MS: "0"
      AGENT_BROWSER_DASHBOARD_PORT: ${AGENT_BROWSER_DASHBOARD_PORT:-4848}
    volumes:
      - ./lab/scripts:/scripts:ro
      - agent_browser_data:/data
    command: [bash, /scripts/agent-browser.sh]
    restart: unless-stopped
    mem_limit: 1536m

volumes:
  obscura_data:
  lightpanda_data:
  browseros_config:
  agent_browser_data:
