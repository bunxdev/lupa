worker_processes 1;
pid /run/lupa/nginx.pid;
error_log stderr warn;
include /etc/nginx/modules-enabled/*.conf;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /run/lupa/nginx-body;
  proxy_temp_path /run/lupa/nginx-proxy;
  fastcgi_temp_path /run/lupa/nginx-fastcgi;
  uwsgi_temp_path /run/lupa/nginx-uwsgi;
  scgi_temp_path /run/lupa/nginx-scgi;
  server {
    listen 3000;
    listen 3001 ssl;
    ssl_certificate /config/ssl/cert.pem;
    ssl_certificate_key /config/ssl/cert.key;
    #AUTH#
    root /usr/share/selkies/web;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /websocket {
      proxy_pass http://127.0.0.1:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      client_max_body_size 10M;
    }
    location /files/ {
      alias /config/Downloads/;
      fancyindex on;
      fancyindex_header /nginx/header.html;
      fancyindex_footer /nginx/footer.html;
      add_header X-Content-Type-Options nosniff;
    }
  }
}
