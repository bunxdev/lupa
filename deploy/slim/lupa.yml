services:
  lupa:
    image: ${LUPA_IMAGE:-bunxdev/lupa:0.0.3}
    build:
      context: ../..
      dockerfile: Dockerfile
    shm_size: 2gb
    ports:
      - "${LUPA_BIND:-127.0.0.1}:${LUPA_API_PORT:-3136}:3036"
      - "${LUPA_BIND:-127.0.0.1}:${SELKIES_PORT:-6180}:3000"
    environment:
      LUPA_API_TOKEN: ${LUPA_API_TOKEN:-}
      LUPA_API_TOKEN_FILE: ${LUPA_API_TOKEN_FILE:-}
      LUPA_MAX_BODY_BYTES: ${LUPA_MAX_BODY_BYTES:-5242880}
      SELKIES_USER: ${SELKIES_USER:-lupa}
      SELKIES_PASSWORD: ${SELKIES_PASSWORD:-}
      SELKIES_PUBLIC_PORT: ${SELKIES_PORT:-6180}
      PUID: ${PUID:-911}
      PGID: ${PGID:-911}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - lupa_config:/config
      - ./.runtime/extensions:/extensions:ro
      - ./.runtime/downloads:/config/Downloads
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  lupa_config:
